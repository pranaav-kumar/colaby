services:
  postgres:
    image: postgres:17-alpine
    container_name: colaby-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colaby}
      POSTGRES_USER: ${POSTGRES_USER:-colaby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - colaby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: colaby-redis
    ports:
      - "6379:6379"
    volumes:
      - colaby-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  colaby-postgres-data:
  colaby-redis-data:
