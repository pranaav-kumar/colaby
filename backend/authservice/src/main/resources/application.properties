spring.application.name=authservice

server.port=8081

spring.config.import=optional:application-local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Fetch registry on startup so LoadBalancer has instances ready immediately (prevents cold-start 504)
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# ---- Feign / LoadBalancer timeouts ----
# Default Feign timeouts are very low (1s connect, 5s read).
# Increase to survive occasional cold-start latency.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ---- Actuator ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
