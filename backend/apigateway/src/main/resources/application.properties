spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/votes/**
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[6].filters[1]=CircuitBreaker=name=votesCB,fallbackuri=forward:/fallback/votes

# ---- CORS ----
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# ---- Actuator lockdown ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
