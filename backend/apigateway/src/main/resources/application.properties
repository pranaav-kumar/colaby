spring.application.name=apigateway
server.port=8080

spring.config.import=optional:application-local.properties

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Redis (for rate limiter) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Timeouts ----
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
# Global response timeout — generous enough for auth signup (BCrypt + Feign call to userdetailsservice)
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s

# ---- Routes ----
# Unauthenticated route: Rate limited by IP address
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[1]=CircuitBreaker=name=authCB,fallbackuri=forward:/fallback/auth

# Authenticated route: Rate limited by User UUID
# SECURITY: Excludes /users/internal/** — internal endpoints are only for service-to-service (Feign).
spring.cloud.gateway.server.webflux.routes[1].id=user-details-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USERDETAILSSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/details,/users/details/**,/users/allprofiles
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[1]=CircuitBreaker=name=userDetailsCB,fallbackuri=forward:/fallback/users

# Authenticated route: Rate limited by User UUID
spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROFILESERVICE
