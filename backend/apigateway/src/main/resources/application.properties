spring.application.name=apigateway
server.port=8080

spring.config.import=optional:application-local.properties

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Redis (for rate limiter) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Timeouts ----
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
# Global response timeout raised to 30s to survive BCrypt + Feign cold-start on signup
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# ---- Resilience4j TimeLimiter ----
# THE CRITICAL FIX: Resilience4j's TimeLimiter defaults to 1 second.
# Spring Cloud Gateway's CircuitBreaker filter applies TimeLimiter BEFORE
# the gateway response-timeout, killing requests at exactly ~1s and returning 504.
# These must be longer than each route's response-timeout so the gateway timeout wins.
resilience4j.timelimiter.instances.authCB.timeout-duration=35s
resilience4j.timelimiter.instances.userDetailsCB.timeout-duration=25s
resilience4j.timelimiter.instances.profileCB.timeout-duration=25s
resilience4j.timelimiter.instances.communityCB.timeout-duration=25s
resilience4j.timelimiter.instances.postsCB.timeout-duration=25s
resilience4j.timelimiter.instances.commentsCB.timeout-duration=25s
resilience4j.timelimiter.instances.votesCB.timeout-duration=25s
resilience4j.timelimiter.instances.projectCB.timeout-duration=25s

# ---- Routes ----
# Unauthenticated route: Rate limited by IP address
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
#spring.cloud.gateway.server.webflux.routes[0].filters[1]=CircuitBreaker=name=authCB,fallbackuri=forward:/fallback/auth
# Per-route response timeout override: auth signup does BCrypt + cross-service Feign call — needs more time
spring.cloud.gateway.server.webflux.routes[0].metadata.response-timeout=30000

# Authenticated route: Rate limited by User UUID
# SECURITY: Excludes /users/internal/** — internal endpoints are only for service-to-service (Feign).
spring.cloud.gateway.server.webflux.routes[1].id=user-details-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USERDETAILSSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/details,/users/details/**,/users/allprofiles
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[1]=CircuitBreaker=name=userDetailsCB,fallbackuri=forward:/fallback/users

# Authenticated route: Rate limited by User UUID
spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROFILESERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/profiles/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[2].filters[1]=CircuitBreaker=name=profileCB,fallbackuri=forward:/fallback/profiles

# Authenticated route: Community service - communities
spring.cloud.gateway.server.webflux.routes[3].id=community-service-communities
spring.cloud.gateway.server.webflux.routes[3].uri=lb://COMMUNITYSERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/communities/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[3].filters[1]=CircuitBreaker=name=communityCB,fallbackuri=forward:/fallback/communities

# Authenticated route: Community service - posts
spring.cloud.gateway.server.webflux.routes[4].id=community-service-posts
spring.cloud.gateway.server.webflux.routes[4].uri=lb://COMMUNITYSERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/posts/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[4].filters[1]=CircuitBreaker=name=postsCB,fallbackuri=forward:/fallback/posts

# Authenticated route: Community service - comments
spring.cloud.gateway.server.webflux.routes[5].id=community-service-comments
spring.cloud.gateway.server.webflux.routes[5].uri=lb://COMMUNITYSERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/comments/**
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[5].filters[1]=CircuitBreaker=name=commentsCB,fallbackuri=forward:/fallback/comments

# Authenticated route: Community service - votes
spring.cloud.gateway.server.webflux.routes[6].id=community-service-votes
spring.cloud.gateway.server.webflux.routes[6].uri=lb://COMMUNITYSERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/votes/**
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[6].filters[1]=CircuitBreaker=name=votesCB,fallbackuri=forward:/fallback/votes

# Authenticated route: Project service
spring.cloud.gateway.server.webflux.routes[7].id=project-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://PROJECTSERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/projects/**
spring.cloud.gateway.server.webflux.routes[7].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.key-resolver=#{@userKeyResolver}
#spring.cloud.gateway.server.webflux.routes[7].filters[1]=CircuitBreaker=name=projectCB,fallbackuri=forward:/fallback/projects
spring.cloud.gateway.server.webflux.routes[7].metadata.response-timeout=20000

# ---- Resilience4j Circuit Breaker configuration ----
# slowCallDurationThreshold must be LONGER than the route response-timeout
# so the CB never fires before a legitimate slow response finishes.
# minimumNumberOfCalls=10 prevents CB from tripping on first cold-start request.
resilience4j.circuitbreaker.instances.authCB.slow-call-duration-threshold=35s
resilience4j.circuitbreaker.instances.authCB.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.authCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.authCB.sliding-window-size=20
resilience4j.circuitbreaker.instances.authCB.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.authCB.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.userDetailsCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.userDetailsCB.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.userDetailsCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userDetailsCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.userDetailsCB.sliding-window-size=20
resilience4j.circuitbreaker.instances.userDetailsCB.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.communityCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.communityCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.communityCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.communityCB.sliding-window-size=20
resilience4j.circuitbreaker.instances.communityCB.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.projectCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.projectCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.projectCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.projectCB.sliding-window-size=20
resilience4j.circuitbreaker.instances.projectCB.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.postsCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.postsCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.postsCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.postsCB.sliding-window-size=20

resilience4j.circuitbreaker.instances.commentsCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.commentsCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.commentsCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.commentsCB.sliding-window-size=20

resilience4j.circuitbreaker.instances.votesCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.votesCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.votesCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.votesCB.sliding-window-size=20

resilience4j.circuitbreaker.instances.profileCB.slow-call-duration-threshold=25s
resilience4j.circuitbreaker.instances.profileCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.profileCB.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.profileCB.sliding-window-size=20

# ---- CORS ----
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# ---- Actuator lockdown ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
